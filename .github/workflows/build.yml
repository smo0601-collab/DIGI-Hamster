# DiGi Hami v2 - automatischer Build und Release
#
#  * bei jedem Push / Pull Request: PlatformIO-Firmware + Arduino-Sketch bauen (Kontrolle)
#  * Push auf main mit neuer Version in src/config.h (HAMI_VERSION):
#    Release "v<Version>" veroeffentlichen mit den Dateien aus binaries/,
#    dem Arduino-Sketch und den Notizen aus CHANGELOG.md
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  platformio:
    name: PlatformIO (Firmware + Dateisystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO-Cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO installieren
        run: pip install -U platformio

      - name: Firmware bauen
        run: pio run -e esp32-c3-supermini

      - name: Dateisystem-Image bauen (data/gifs)
        run: pio run -e esp32-c3-supermini -t buildfs

      - name: Dateien einsammeln
        run: |
          B=.pio/build/esp32-c3-supermini
          mkdir -p out
          cp "$B/firmware.bin" "$B/firmware.factory.bin" "$B/littlefs.bin" out/

      - uses: actions/upload-artifact@v4
        with:
          name: digihami-firmware-ci
          path: out/

  arduino:
    name: Arduino IDE (Sketch kompilieren)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: ESP32-Core und Bibliotheken installieren
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install LovyanGFX AnimatedGIF ArduinoJson

      - name: Sketch kompilieren (ESP32C3 Dev Module, USB CDC an, Partition Scheme Custom)
        run: >
          arduino-cli compile
          --fqbn "esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=custom"
          --warnings default
          arduino/DiGi_Hami

  release:
    name: Release veröffentlichen (bei neuer Version)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: v
        run: |
          V=$(sed -n 's/^#define HAMI_VERSION "\(.*\)"/\1/p' src/config.h)
          echo "Version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Gibt es das Release schon?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.v.outputs.version }} existiert bereits - nichts zu tun."
            echo "yes=1" >> "$GITHUB_OUTPUT"
          else
            echo "yes=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Dateien zusammenstellen
        if: steps.exists.outputs.yes == '0'
        run: |
          V=${{ steps.v.outputs.version }}
          # Sicherheitscheck: die mitgelieferte Firmware muss genau diese Version sein
          grep -aq "DIGIHAMI_FW:$V;" binaries/firmware.bin || { echo "::error::binaries/firmware.bin ist nicht Version $V"; exit 1; }
          mkdir -p out
          cp binaries/firmware.bin         "out/DiGi-Hami-Update-v$V.bin"
          cp binaries/firmware.factory.bin "out/DiGi-Hami-Komplett-v$V.bin"
          cp binaries/littlefs.bin         "out/DiGi-Hami-Animationen-v$V.bin"
          cp binaries/LIESMICH.txt         out/LIESMICH.txt
          (cd arduino && zip -qr "../out/DiGi-Hami-Arduino-Sketch-v$V.zip" DiGi_Hami ANLEITUNG.md)
          # Notizen: Abschnitt dieser Version aus CHANGELOG.md + Installationshinweise
          awk -v v="## v$V" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          cat .github/release-hinweise.md >> notes.md
          ls -l out

      - name: Release veröffentlichen
        if: steps.exists.outputs.yes == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          gh release create "v$V" out/* \
            --title "DiGi Hami v$V" \
            --notes-file notes.md \
            --target "${{ github.sha }}"
