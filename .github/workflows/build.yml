# DiGi Hami v2 - automatischer Build
#
#  * bei jedem Push / Pull Request: PlatformIO-Firmware + Arduino-Sketch bauen
#  * bei einem Tag "v*" (z. B. v2.0.1): Firmware + Dateisystem als Release anhaengen
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  platformio:
    name: PlatformIO (Firmware + Dateisystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO-Cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO installieren
        run: pip install -U platformio

      - name: Firmware bauen
        run: pio run -e esp32-c3-supermini

      - name: Dateisystem-Image bauen (data/gifs)
        run: pio run -e esp32-c3-supermini -t buildfs

      - name: Dateien einsammeln
        run: |
          B=.pio/build/esp32-c3-supermini
          mkdir -p out
          cp "$B/firmware.bin" "$B/firmware.factory.bin" "$B/littlefs.bin" binaries/LIESMICH.txt out/

      - uses: actions/upload-artifact@v4
        with:
          name: digihami-firmware
          path: out/

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

  arduino:
    name: Arduino IDE (Sketch kompilieren)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: ESP32-Core und Bibliotheken installieren
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install LovyanGFX AnimatedGIF ArduinoJson

      - name: Sketch kompilieren (ESP32C3 Dev Module, USB CDC an, No OTA)
        run: >
          arduino-cli compile
          --fqbn "esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=no_ota"
          --warnings default
          arduino/DiGi_Hami
