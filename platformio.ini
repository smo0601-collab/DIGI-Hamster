; ============================================================================
;  DiGi Hami v2 - Build-Konfiguration
; ============================================================================
;  Gebaut mit der VS-Code-Erweiterung "pioarduino" (Fork von PlatformIO, der
;  den aktuellen ESP32-Arduino-Core 3.x unterstuetzt).
;  Erweiterung:  pioarduino.pioarduino-ide   (in VS Code nach "pioarduino" suchen)
;
;  Ein Klick auf "Upload" macht alles:
;    1. Web-Oberflaeche in die Firmware einbetten   (scripts/embed_web.py)
;    2. Firmware kompilieren + flashen
;    3. Animationen (data/gifs/*.gif) als LittleFS-Image hochladen
;                                                  (scripts/upload_fs.py)
; ============================================================================

[env:esp32-c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; 4 MB Flash, Standard-Partitionen (identisch zur Arduino IDE "Default 4MB with spiffs"):
;   2 x 1,25 MB App (OTA-Updates ueber die Web-Oberflaeche) + 1,375 MB LittleFS
board_build.partitions = default.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_upload.flash_size = 4MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; --- optionale Anpassungen (siehe src/config.h) ---
    ; -DTFT_BL=10              ; BLK an GPIO10 -> echte Helligkeitsregelung
    ; -DTFT_SPI_HZ=80000000    ; 80 MHz SPI bei kurzen Leitungen
    ; -DTFT_INVERT=0           ; falls Farben invertiert sind
    ; -DHAMI_NO_TURBO          ; Turbo-Dekoder abschalten (spart ~82 KB RAM)

extra_scripts =
    pre:scripts/embed_web.py
    post:scripts/upload_fs.py

lib_deps =
    lovyan03/LovyanGFX@^1.2.19
    bitbank2/AnimatedGIF@^2.2.0
    bblanchon/ArduinoJson@^7.4.2
